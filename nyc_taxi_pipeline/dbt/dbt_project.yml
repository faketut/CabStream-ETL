name: nyc_taxi_dbt
version: '1.0.0'
config-version: 2

profile: nyc_taxi_dbt

model-paths: ["models"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  lookback_days: 90

models:
  nyc_taxi_dbt:
    +materialized: table

seeds:
  nyc_taxi_dbt:
    taxi_zone_lookup:
      +column_types:
        LocationID: INT64
        Borough: STRING
        Zone: STRING
        service_zone: STRING
